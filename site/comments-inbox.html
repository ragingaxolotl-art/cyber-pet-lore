<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reader feedback inbox — Cyber Pet Lore</title><link rel="stylesheet" href="comments.css"><style>body{background:#f4f1e9;margin:0;padding:20px;font:16px/1.6 system-ui;color:#24332e}main{max-width:900px;margin:auto}h1{font-family:Georgia,serif}a{color:#185d65}</style></head><body><main><a href="index.html">← Reading archive</a><h1>Reader feedback inbox</h1><p>Review public comments and read private feedback. Access uses your existing lore backup code; anyone with that code can open this inbox.</p><section class="lore-comments"><form id="unlock"><label>Lore backup code<input id="code" type="password" required autocomplete="current-password" maxlength="256"></label><button type="submit">Unlock inbox</button></form><div id="inbox" hidden><div class="comment-actions"><label>Show<select id="filter"><option value="pending">Public comments awaiting approval</option><option value="private">Private feedback</option><option value="public">Published comments</option><option value="archived">Hidden comments &amp; archived feedback</option></select></label><button id="refresh">Refresh</button><button id="lock">Lock inbox</button></div><div id="items"></div><button id="more" hidden>Load more</button></div><p id="status" role="status" aria-live="polite"></p></section></main><script type="module" src="comments-inbox.mjs"></script></body></html>
